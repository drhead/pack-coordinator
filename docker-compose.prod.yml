name: coordinator-prod

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: coordinator_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coordinator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-coordinator_db}
    shm_size: 2gb
    ports:
      - "${PROD_DB_PORT:-5436}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "effective_cache_size=16GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "max_worker_processes=16"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=1GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coordinator} -d ${POSTGRES_DB:-coordinator_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - readyset-net-prod

  readyset:
    image: readysettech/readyset:latest
    container_name: coordinator_readyset_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UPSTREAM_DB_URL: postgres://${POSTGRES_USER:-coordinator}:${POSTGRES_PASSWORD:-your_secure_password}@postgres:5432/${POSTGRES_DB:-coordinator_db}
      LISTEN_ADDRESS: 0.0.0.0:5433
      DEPLOYMENT_MODE: standalone
      STORAGE_DIR: /data/cache
      DISABLE_TELEMETRY: "true"
      CACHE_MODE: deep
    shm_size: 16gb
    ports:
      - "${PROD_READYSET_PORT:-5437}:5433"
    networks:
      - readyset-net-prod
    volumes:
      - readyset_cache_prod:/data/cache

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_E621_APP_AUTHOR: ${VITE_E621_APP_AUTHOR}
        VITE_APP_ENV: ${VITE_APP_ENV:-prod}
        VITE_DOMAIN: ${VITE_DOMAIN}
    container_name: coordinator_web_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      readyset:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      READYSET_HOST: readyset
      READYSET_PORT: 5433
      USE_READYSET: "true"
      POSTGRES_USER: ${POSTGRES_USER:-coordinator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-coordinator_db}
      E621_USERNAME: ${E621_USERNAME}
      VITE_E621_APP_AUTHOR: ${VITE_E621_APP_AUTHOR}
      VITE_DOMAIN: ${VITE_DOMAIN}
    ports:
      - "${PROD_WEB_PORT:-8621}:8500"
    volumes:
      - ./data:/app/data
    networks:
      - readyset-net-prod

volumes:
  postgres_data_prod:
  readyset_cache_prod:

networks:
  readyset-net-prod:
    driver: bridge
