name: coordinator-prod

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: coordinator_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    shm_size: 16gb
    ports:
      - "${PROD_DB_PORT}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c" 
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_connections=400"
      - "-c"
      - "shared_buffers=32GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=4GB"
      - "-c"
      - "effective_cache_size=96GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "max_worker_processes=128"
      - "-c"
      - "max_parallel_workers=64"
      - "-c"
      - "max_parallel_workers_per_gather=16"
      - "-c"
      - "max_wal_size=16GB"
      - "-c"
      - "min_wal_size=2GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - readyset-net-prod

  readyset:
    image: readysettech/readyset:latest
    container_name: coordinator_readyset_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UPSTREAM_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LISTEN_ADDRESS: 0.0.0.0:5433
      DEPLOYMENT_MODE: standalone
      STORAGE_DIR: /data/cache
      DISABLE_TELEMETRY: "true"
      CACHE_MODE: deep
    shm_size: 16gb
    ports:
      - "${PROD_READYSET_PORT}:5433"
    networks:
      - readyset-net-prod
    volumes:
      - readyset_cache_prod:/data/cache

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coordinator_web_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      readyset:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      READYSET_HOST: readyset
      READYSET_PORT: 5433
      USE_READYSET: "true"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      E621_USERNAME: ${E621_USERNAME}
    ports:
      - "${PROD_WEB_PORT}:8500"
    volumes:
      - ./data:/app/data
    networks:
      - readyset-net-prod

volumes:
  postgres_data_prod:
  readyset_cache_prod:

networks:
  readyset-net-prod:
    driver: bridge
