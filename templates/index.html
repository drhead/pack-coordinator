<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Configuration & Page Title -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.A.C.K.</title>

    <!-- Static Assets -->
    <link rel="stylesheet" href="/static/css/input.css">
    <script type="module" src="/static/js/app.js"></script>

    <!-- Alpine Cloak Utility -->
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen font-sans" x-data="app" x-cloak>

    <!-- 18+ Age Gate Interstitial -->
    <load src="/templates/components/age-modal.html" />

    <load src="/templates/components/loading.html" />

    <template x-if="isAgeVerified && !isLoading">
        <div class="min-h-screen flex flex-col">
            <!-- Top Navigation Header -->
            <header
                class="bg-gray-900 border-b border-gray-800 px-3 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-50">

                <!-- Left Side: App Brand Title & Dynamic Breadcrumb Navigation -->
                <div class="flex items-center space-x-3 flex-wrap gap-y-1">
                    <h1 class="text-lg font-bold text-blue-400 cursor-pointer hover:text-blue-300 transition inline-flex items-baseline"
                        @click="currentScreen = 'projects'; $store.batches.activeProject = null; $store.batches.activeBatch = null;">
                        <span class="mr-[0.00em]">P</span><span>.A.C.K.</span>
                    </h1>

                    <!-- Breadcrumbs Container -->
                    <template x-if="$store.batches.activeProject">
                        <div class="flex items-center space-x-2 text-sm text-gray-400 flex-wrap">
                            <span>/</span>
                            <button class="hover:text-white transition cursor-pointer" @click="currentScreen = 'batches'"
                                x-text="$store.batches.activeProject.title"></button>

                            <template x-if="$store.batches.activeBatch">
                                <div class="flex items-center space-x-2">
                                    <span>/</span>
                                    <span class="text-gray-200 font-mono"
                                        x-text="`Batch ${$store.batches.activeBatch.batch_number}`"></span>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- Right Side: Modal Triggers & Active Lease Indicator -->
                <div class="flex items-center space-x-2 sm:space-x-3 text-xs font-mono flex-wrap gap-y-2">

                    <!-- Instructions Modal Trigger -->
                    <button @click="showInstructionsModal = true"
                        class="h-7 bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-3 rounded-md font-sans font-semibold flex items-center space-x-1.5 transition cursor-pointer">
                        <svg class="w-3.5 h-3.5 text-gray-300 fill-current shrink-0" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                        </svg>
                        <span>Instructions</span>
                    </button>

                    <!-- Blacklist Settings Modal Trigger -->
                    <button @click="$store.blacklist.openModal()"
                        class="h-7 bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-3 rounded-md font-sans font-semibold flex items-center space-x-1.5 transition cursor-pointer">
                        <span style="font-variant-emoji: text;">🚫</span>
                        <span>Blacklist</span>
                    </button>

                    <!-- Login / Account State -->
                    <div class="flex items-center">
                        <template x-if="!$store.auth.e621User">
                            <button @click="$store.auth.openLoginModal()"
                                class="h-7 bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-3 rounded-md font-sans font-semibold flex items-center space-x-1.5 transition text-xs cursor-pointer">
                                <span style="font-variant-emoji: text;">🔑</span>
                                <span>Login</span>
                            </button>
                        </template>

                        <template x-if="$store.auth.e621User">
                            <div
                                class="h-7 flex items-center space-x-2 bg-gray-950/60 border border-gray-800 px-3 rounded-md text-xs">
                                <span class="text-gray-400">Logged in as</span>
                                <span class="text-blue-400 font-semibold" x-text="$store.auth.e621User.username"></span>
                                <button @click="$store.auth.logout()" title="Logout"
                                    class="text-gray-500 hover:text-red-400 font-bold ml-1 transition cursor-pointer">&times;</button>
                            </div>
                        </template>
                    </div>

                    <!-- Active Lease Badge (Claimed State) -->
                    <template x-if="currentScreen !== 'projects' && $store.batches.activeLease">
                        <div
                            class="h-7 flex items-center space-x-2 bg-amber-950/60 border border-amber-800/60 px-3 rounded-md">
                            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                            <span class="text-amber-200">Claimed:</span>
                            <button class="text-amber-300 font-bold hover:underline cursor-pointer"
                                @click="jumpToLeasedBatch($store.batches.activeLease)"
                                x-text="`Batch #${$store.batches.activeLease.batch_number}`"></button>
                            <template x-if="$store.batches.getRemainingTime($store.batches.activeLease.leased_until)">
                                <span class="text-amber-400 font-semibold"
                                    x-text="`(${$store.batches.getRemainingTime($store.batches.activeLease.leased_until)})`"></span>
                            </template>
                            <button
                                class="ml-1 h-5 px-2 bg-amber-900/80 hover:bg-amber-800 text-amber-200 rounded text-[10px] font-sans font-semibold transition cursor-pointer flex items-center justify-center"
                                @click="revokeLease($store.batches.activeLease.batch_id)">
                                Release
                            </button>
                        </div>
                    </template>

                    <!-- Active Lease Badge (Unclaimed State) -->
                    <template x-if="currentScreen !== 'projects' && !$store.batches.activeLease">
                        <div
                            class="h-7 flex items-center text-gray-500 bg-gray-950/60 border border-gray-800 px-3 rounded-md">
                            No batch claimed
                        </div>
                    </template>
                </div>
            </header>

            <!-- Main Content Container -->
            <main class="max-w-7xl mx-auto p-6 flex-1 w-full">

                <!-- SCREEN 1: PROJECT SELECTION -->
                <load src="/templates/components/screen-projects.html" />

                <!-- SCREEN 2: BATCH EXPLORER -->
                <load src="/templates/components/screen-batches.html" />

                <!-- SCREEN 3: BATCH DETAIL VIEW -->
                <load src="/templates/components/screen-batch-detail.html" />

                <!-- SCREEN 4: ABOUT VIEW -->
                <load src="/templates/components/screen-about.html" />

            </main>

            <!-- Global Page Footer (Pushed to bottom via mt-auto) -->
            <footer class="mt-auto border-t border-gray-800/80 py-6 text-center text-xs text-gray-500 font-mono">
                <div class="flex items-center justify-center space-x-3">
                    <a href="https://github.com/drhead/cleanup-coordinator" target="_blank"
                        class="hover:text-gray-300 transition flex items-center space-x-1">
                        <span>GitHub</span>
                    </a>
                    <span class="text-gray-700">|</span>
                    <button @click="currentScreen = 'about'"
                        class="hover:text-blue-400 text-gray-400 transition cursor-pointer">
                        About
                    </button>
                </div>
            </footer>

            <!-- General Instructions Modal -->
            <load src="/templates/components/instructions-modal.html" />

            <!-- Blacklist Editor Modal -->
            <load src="/templates/components/blacklist-modal.html" />

            <!-- Login Modal -->
            <load src="/templates/components/login-modal.html" />

            <!-- Image Modal -->
            <load src="/templates/components/image-modal.html" />

            <!-- Toast Notifications Container -->
            <load src="/templates/components/toast-container.html" />
        </div>
    </template>
</body>

</html>
