<div class="border rounded-lg transition shadow-md overflow-hidden" x-data="{ 
         activeView: 'none', 
         hoveredImplicationData: null, 
         hoveredMergedData: null,
         resMgr: resolutionManager(cluster),
         discardAndExit() {
             this.resMgr.resetClusterWork();
             this.activeView = 'none';
         }
     }" :class="cluster.is_resolved ? 'bg-gray-900/60 border-gray-800/80 opacity-80' : 'bg-gray-900 border-gray-800'">

    <!-- Cluster Header Line (Collapsible Trigger) -->
    <div class="px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 cursor-pointer select-none hover:bg-gray-800/30 transition min-h-[50px]"
        @click="cluster.collapsed = !cluster.collapsed"
        :class="cluster.collapsed ? 'border-b border-transparent' : 'border-b border-gray-800/60'">

        <!-- Left Indicators -->
        <div class="flex flex-wrap items-center gap-2 h-7">
            <svg class="w-4 h-4 text-gray-400 hover:text-white transition-transform duration-150 shrink-0"
                :class="cluster.collapsed ? '' : 'rotate-90'"
                viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
            </svg>

            <span class="font-mono text-xs text-gray-400 font-bold leading-none" x-text="`Cluster #${cluster.cluster_index}`"></span>

            <!-- Resolution Status Badge -->
            <span class="text-[10px] px-2 h-5 rounded font-bold uppercase tracking-wider inline-flex items-center leading-none"
                :class="cluster.is_resolved ? 'bg-green-950 text-green-400 border border-green-800/50' : 'bg-gray-800 text-gray-400'"
                x-text="cluster.is_resolved ? 'RESOLVED' : 'UNRESOLVED'"></span>

            <!-- BLACKLISTED Label Indicator -->
            <template x-if="cluster.is_blacklisted">
                <span
                    class="bg-black text-white border border-gray-700 text-[10px] px-2 h-5 rounded font-bold uppercase tracking-wider shadow-sm inline-flex items-center leading-none"
                    :title="`Matched Rule: ${cluster.matched_rule}`">
                    BLACKLISTED
                </span>
            </template>
        </div>

        <!-- Right Side: Cluster Note & Action Controls -->
        <div class="flex items-center gap-3 h-7">
            <!-- Cluster Warning Note (if present) -->
            <template x-if="cluster.note">
                <div
                    class="h-7 flex items-center space-x-1.5 text-xs font-medium text-amber-300 bg-amber-950/60 border border-amber-800/80 px-3 rounded-md shadow-sm">
                    <span class="text-amber-400 font-bold leading-none">⚠️</span>
                    <span class="leading-none" x-text="cluster.note"></span>
                </div>
            </template>

            <!-- Action Button: Only visible on header when expanded & activeView === 'none' -->
            <template x-if="!cluster.collapsed && activeView === 'none'">
                <div class="flex items-center h-7" @click.stop>
                    <template x-if="$store.auth?.e621User">
                        <button @click.stop="activeView = 'compare'"
                            class="h-7 bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 rounded-md font-semibold transition flex items-center gap-1.5 shadow-md cursor-pointer leading-none">
                            <span style="font-variant-emoji: text;">🔍</span>
                            <span>Start Comparison</span>
                        </button>
                    </template>
                    <template x-if="!$store.auth?.e621User">
                        <button disabled title="Log in with e621 credentials to start cluster comparison"
                            class="h-7 bg-gray-800 text-gray-500 border border-gray-700 text-xs px-3 rounded-md font-semibold flex items-center gap-1.5 cursor-not-allowed leading-none">
                            <span style="font-variant-emoji: text;">🔍</span>
                            <span>Start Comparison</span>
                        </button>
                    </template>
                </div>
            </template>

            <!-- Discard & Exit Button: Only visible on header when expanded & activeView !== 'none' -->
            <template x-if="!cluster.collapsed && activeView !== 'none'">
                <div class="flex items-center h-7" @click.stop>
                    <button @click.stop="discardAndExit()"
                        class="h-7 bg-red-950/60 hover:bg-red-900/80 text-red-300 hover:text-red-200 border border-red-800/60 text-xs px-3 rounded-md font-semibold transition flex items-center gap-1.5 cursor-pointer leading-none shadow-sm"
                        title="Exit workflow and discard all uncommitted changes for this cluster">
                        <span style="font-variant-emoji: text;">✕</span>
                        <span>Discard & Exit</span>
                    </button>
                </div>
            </template>
        </div>
    </div>

    <!-- Expanded Body Content -->
    <template x-if="!cluster.collapsed">
        <div class="p-4 pt-3 space-y-4">
            <!-- Cluster Workflow Container -->
            <div x-ref="resMgr" class="space-y-3">

                <!-- Screen 1: Comparison View Scope -->
                <template x-if="activeView === 'compare'">
                    <div x-data="ComparisonManager(resMgr)" x-init="startComparison($data)">
                        <template x-if="isActive">
                            <div class="space-y-3">
                                <load src="/templates/components/cluster-comparison.html" />
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Screen 2: Tag Reconciliation View Scope -->
                <template x-if="activeView === 'reconcile'">
                    <div x-data="ReconciliationManager(resMgr)" x-init="startReconciliation()">
                        <!-- Loading Spinner while ReconciliationManager initializes -->
                        <template x-if="isLoading || !isActive">
                            <div class="flex flex-col items-center justify-center min-h-[360px] p-8 space-y-3 bg-gray-950/60 border border-gray-800/80 rounded-lg shadow-inner">
                                <div class="w-8 h-8 border-3 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin"></div>
                                <p class="text-xs text-gray-400 font-medium animate-pulse">Loading tag reconciliation...</p>
                            </div>
                        </template>

                        <template x-if="!isLoading && isActive">
                            <div class="space-y-3">
                                <load src="/templates/components/cluster-reconciliation.html" />
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Screen 3: Summary View Scope -->
                <template x-if="activeView === 'summary'">
                    <div x-data="summaryManager(resMgr)" class="space-y-3">
                        <load src="/templates/components/cluster-summary.html" />
                    </div>
                </template>

            </div>

            <!-- Posts Grid inside Cluster -->
            <template x-if="activeView === 'none'">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="post in cluster.posts" :key="post.post_id">
                        <load src="/templates/components/post-card.html" />
                    </template>
                </div>
            </template>
        </div>
    </template>
</div>
