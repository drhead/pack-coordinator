<div class="bg-gray-950/80 border border-gray-800/80 rounded-lg p-4 space-y-4 text-xs">

    <!-- Header Controls -->
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-800/80 pb-3">

        <!-- Loupe Master Controls -->
        <div class="flex items-center gap-3 pr-3">
            <label class="flex items-center gap-1.5 text-xs text-gray-300 cursor-pointer select-none">
                <input type="checkbox" x-model="enableLoupe"
                    class="rounded bg-gray-900 border-gray-700 text-blue-600 focus:ring-0">
                <span>Enable Loupe</span>
            </label>

            <div x-show="enableLoupe" class="flex items-center gap-2 text-xs text-gray-400 border-l border-gray-800/80 pl-3">
                <span>Zoom:</span>
                <input type="range" min="1" max="4" step="0.5" x-model.number="zoomLevel"
                    class="w-16 accent-blue-500 cursor-pointer">
                <span class="font-mono w-5 text-right" x-text="`${zoomLevel}x`"></span>
            </div>
        </div>

        <!-- Mode Selector -->
        <div class="flex items-center gap-2">
            <div class="flex bg-gray-900 border border-gray-800 rounded-md p-0.5">
                <button @click="setMode('side-by-side')" class="text-xs px-2.5 py-1 rounded font-medium transition"
                    :class="mode === 'side-by-side' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'">
                    Side-by-Side
                </button>
                <button @click="setMode('swipe')" class="text-xs px-2.5 py-1 rounded font-medium transition"
                    :class="mode === 'swipe' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'">
                    Swipe
                </button>
                <button @click="setMode('diff')" class="text-xs px-2.5 py-1 rounded font-medium transition"
                    :class="mode === 'diff' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'">
                    Diff
                </button>
                <button @click="setMode('blink')" class="text-xs px-2.5 py-1 rounded font-medium transition"
                    :class="mode === 'blink' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'">
                    Blink
                </button>
            </div>
        </div>
    </div>

    <!-- Main Image Display View Area -->
    <template x-if="currentPair">
        <div class="space-y-4">

            <!-- 1. SIDE-BY-SIDE MODE -->
            <div x-show="mode === 'side-by-side'" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="item in [currentPair.a, currentPair.b]" :key="item.post_id">
                    <div class="flex flex-col items-center bg-gray-900 border border-gray-800/80 rounded-lg p-3">
                        <div class="w-full flex items-center justify-between mb-2">
                            <a :href="`https://e621.net/posts/${item.post_id}`" target="_blank"
                                class="text-xs font-mono font-bold text-blue-400 hover:underline"
                                x-text="`#${item.post_id}`"></a>
                            <span class="font-mono text-[11px]"
                                :class="image.isUniform([currentPair.a, currentPair.b], item) ? 'text-gray-600' : 'text-gray-400'"
                                x-text="image.formatSpecs(item)">
                            </span>
                        </div>

                        <!-- Clickable Image Container -->
                        <div class="relative w-full h-[60vh] flex items-center justify-center bg-black/60 rounded-md overflow-hidden select-none cursor-pointer group border border-gray-800/60"
                            @click="openModal(item)">

                            <div class="relative max-w-full flex items-center justify-center">
                                <template x-if="!item.fileUrl">
                                    <div class="flex flex-col items-center justify-center p-6 space-y-2">
                                        <div class="w-6 h-6 border-2 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>
                                        <span class="text-[10px] text-gray-500 font-medium">Loading image...</span>
                                    </div>
                                </template>
                                <template x-if="item.fileUrl">
                                    <img :src="item.fileUrl" class="max-h-[60vh] max-w-full object-contain block"
                                        @mousemove="handleMouseMove($event, $el)" @mouseenter="isHovering = true"
                                        @mouseleave="handleMouseLeave()">
                                </template>

                                <load src="/templates/components/expand-image-button.html" />

                                <div x-show="enableLoupe && isHovering"
                                    class="absolute pointer-events-none border-2 border-blue-500 rounded shadow-2xl z-20 bg-no-repeat"
                                    :class="!(enableLoupe && isHovering) ? 'hidden' : ''"
                                    :style="{
                                         ...getLoupeStyle(item),
                                         left: `calc(${relX * 100}% - ${loupeSize / 2}px)`,
                                         top: `calc(${relY * 100}% - ${loupeSize / 2}px)`,
                                         display: (enableLoupe && isHovering) ? 'block' : 'none'
                                     }">
                                </div>
                            </div>
                        </div>

                        <!-- Collapsible Post Description & Sources (Side-by-Side View) -->
                        <div class="w-full space-y-1.5 pt-2">
                            <template x-if="item.description && item.description.trim().length > 0">
                                <details
                                    class="w-full bg-gray-950/60 border border-gray-800/80 rounded-md text-[11px] group">
                                    <summary
                                        class="px-2.5 py-1 font-semibold text-gray-400 hover:text-gray-200 cursor-pointer select-none flex items-center justify-between">
                                        <span>Description</span>
                                        <span
                                            class="text-[9px] text-gray-500 group-open:rotate-180 transition-transform">▼</span>
                                    </summary>
                                    <div class="px-2.5 py-2 border-t border-gray-800/80 text-gray-300 whitespace-pre-wrap break-words max-h-36 overflow-y-auto"
                                        x-text="item.description"></div>
                                </details>
                            </template>

                            <template x-if="item.sources && item.sources.length > 0">
                                <details
                                    class="w-full bg-gray-950/60 border border-gray-800/80 rounded-md text-[11px] group">
                                    <summary
                                        class="px-2.5 py-1 font-semibold text-gray-400 hover:text-gray-200 cursor-pointer select-none flex items-center justify-between">
                                        <span x-text="`Sources (${item.sources.length})`"></span>
                                        <span
                                            class="text-[9px] text-gray-500 group-open:rotate-180 transition-transform">▼</span>
                                    </summary>
                                    <div
                                        class="px-2.5 py-2 border-t border-gray-800/80 space-y-1 max-h-32 overflow-y-auto">
                                        <template x-for="(src, sIdx) in item.sources" :key="sIdx">
                                            <a :href="src" target="_blank" rel="noopener noreferrer"
                                                class="block truncate text-blue-400 hover:text-blue-300 hover:underline font-mono text-[10px]"
                                                x-text="src"></a>
                                        </template>
                                    </div>
                                </details>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- 2. SINGLE BOX MODES (SWIPE, DIFF, BLINK) -->
            <div x-show="mode !== 'side-by-side'"
                class="flex flex-col items-center bg-gray-900 border border-gray-800/80 rounded-lg p-3">

                <!-- Top Header Bar (Fixed height & width to prevent vertical shifting on mode switch) -->
                <div class="w-full flex items-center justify-between h-5 mb-2 px-0.5 select-none">

                    <!-- SWIPE MODE TOP BAR -->
                    <template x-if="mode === 'swipe'">
                        <div class="w-full grid grid-cols-2 items-center h-5">
                            <!-- Left Side: #A on left, Info specs on right -->
                            <div class="flex items-center justify-between pr-3 border-r border-gray-800/80">
                                <a :href="`https://e621.net/posts/${currentPair.a.post_id}`" target="_blank"
                                    class="text-xs font-mono font-bold text-blue-400 hover:underline"
                                    x-text="`#${currentPair.a.post_id}`"></a>
                                <span class="font-mono text-[11px]"
                                    :class="image.isUniform([currentPair.a, currentPair.b], currentPair.a) ? 'text-gray-600' : 'text-gray-400'"
                                    x-text="image.formatSpecs(currentPair.a)">
                                </span>
                            </div>

                            <!-- Right Side: Info specs on left, #B on right (Swapped) -->
                            <div class="flex items-center justify-between pl-3">
                                <span class="font-mono text-[11px]"
                                    :class="image.isUniform([currentPair.a, currentPair.b], currentPair.b) ? 'text-gray-600' : 'text-gray-400'"
                                    x-text="image.formatSpecs(currentPair.b)">
                                </span>
                                <a :href="`https://e621.net/posts/${currentPair.b.post_id}`" target="_blank"
                                    class="text-xs font-mono font-bold text-blue-400 hover:underline"
                                    x-text="`#${currentPair.b.post_id}`"></a>
                            </div>
                        </div>
                    </template>

                    <!-- DIFF MODE TOP BAR -->
                    <template x-if="mode === 'diff'">
                        <div class="w-full flex items-center justify-center font-mono text-xs">
                            <span class="font-bold text-blue-400"
                                x-text="`#${currentPair.a.post_id} - #${currentPair.b.post_id}`"></span>
                        </div>
                    </template>

                    <!-- BLINK MODE TOP BAR -->
                    <template x-if="mode === 'blink'">
                        <div class="w-full flex items-center justify-between font-mono">
                            <!-- Left Side: Active # -->
                            <a :href="`https://e621.net/posts/${(blinkShowB ? currentPair.b : currentPair.a).post_id}`" target="_blank"
                                class="text-xs font-bold text-blue-400 hover:underline"
                                x-text="`#${(blinkShowB ? currentPair.b : currentPair.a).post_id}`"></a>
                            <!-- Right Side: Active Image Info Template -->
                            <span class="text-[11px]"
                                :class="image.isUniform([currentPair.a, currentPair.b], blinkShowB ? currentPair.b : currentPair.a) ? 'text-gray-600' : 'text-gray-400'"
                                x-text="image.formatSpecs(blinkShowB ? currentPair.b : currentPair.a)">
                            </span>
                        </div>
                    </template>

                </div>

                <div class="relative w-full h-[60vh] flex items-center justify-center bg-black/60 rounded-md overflow-hidden select-none cursor-pointer group border border-gray-800/60"
                    @click="openModal()">

                    <!-- SWIPE MODE -->
                    <div x-show="mode === 'swipe'"
                        class="relative max-w-full flex items-center justify-center cursor-ew-resize"
                        @mousemove="handleSwipeMove($event, $el); handleMouseMove($event, $el)"
                        @mouseenter="isHovering = true" @mouseleave="handleMouseLeave()">

                        <img :src="currentPair.a.fileUrl"
                            class="max-h-[60vh] max-w-full object-contain block pointer-events-none">

                        <img :src="currentPair.b.fileUrl"
                            class="absolute inset-0 w-full h-full object-contain block pointer-events-none"
                            :style="`clip-path: inset(0 ${100 - swipePos}% 0 0);`">

                        <div class="absolute top-0 bottom-0 w-0.5 bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)] pointer-events-none"
                            :style="`left: ${swipePos}%;`">
                        </div>

                        <load src="/templates/components/expand-image-button.html" />

                        <!-- Swipe Loupe Overlay -->
                        <div x-show="enableLoupe && isHovering"
                            class="absolute pointer-events-none border-2 border-blue-500 rounded shadow-2xl z-20 overflow-hidden"
                            :class="!(enableLoupe && isHovering) ? 'hidden' : ''"
                            :style="{
                                 width: `${loupeSize}px`,
                                 height: `${loupeSize}px`,
                                 left: `calc(${relX * 100}% - ${loupeSize / 2}px)`,
                                 top: `calc(${relY * 100}% - ${loupeSize / 2}px)`,
                                 display: (enableLoupe && isHovering) ? 'block' : 'none'
                             }">
                            <div class="absolute inset-0 bg-no-repeat" :style="getLoupeStyle(currentPair.a)"></div>
                            <div class="absolute inset-0 bg-no-repeat"
                                :style="{ ...getLoupeStyle(currentPair.b), ...getSwipeLoupeClipStyle() }"></div>
                        </div>
                    </div>

                    <!-- DIFF MODE -->
                    <div x-show="mode === 'diff'" class="relative max-w-full flex items-center justify-center bg-black"
                        @mousemove="handleMouseMove($event, $el)" @mouseenter="isHovering = true"
                        @mouseleave="handleMouseLeave()">

                        <img :src="currentPair.a.fileUrl" class="max-h-[60vh] max-w-full object-contain block">

                        <img :src="currentPair.b.fileUrl" class="absolute inset-0 w-full h-full object-contain block"
                            style="mix-blend-mode: difference;">

                        <load src="/templates/components/expand-image-button.html" />

                        <div x-show="enableLoupe && isHovering"
                            class="absolute pointer-events-none border-2 border-blue-500 rounded shadow-2xl z-20 bg-no-repeat"
                            :class="!(enableLoupe && isHovering) ? 'hidden' : ''"
                            :style="{
                                 ...getDiffLoupeStyle(currentPair.a, currentPair.b),
                                 left: `calc(${relX * 100}% - ${loupeSize / 2}px)`,
                                 top: `calc(${relY * 100}% - ${loupeSize / 2}px)`,
                                 display: (enableLoupe && isHovering) ? 'block' : 'none'
                             }">
                        </div>
                    </div>

                    <!-- BLINK MODE -->
                    <div x-show="mode === 'blink'" class="relative max-w-full flex items-center justify-center"
                        @mousemove="handleMouseMove($event, $el)" @mouseenter="isHovering = true"
                        @mouseleave="handleMouseLeave()">

                        <img :src="(blinkShowB ? currentPair.b : currentPair.a).fileUrl"
                            class="max-h-[60vh] max-w-full object-contain block">

                        <load src="/templates/components/expand-image-button.html" />

                        <div x-show="enableLoupe && isHovering"
                            class="absolute pointer-events-none border-2 border-blue-500 rounded shadow-2xl z-20 bg-no-repeat"
                            :class="!(enableLoupe && isHovering) ? 'hidden' : ''"
                            :style="{
                                 ...getLoupeStyle(blinkShowB ? currentPair.b : currentPair.a),
                                 left: `calc(${relX * 100}% - ${loupeSize / 2}px)`,
                                 top: `calc(${relY * 100}% - ${loupeSize / 2}px)`,
                                 display: (enableLoupe && isHovering) ? 'block' : 'none'
                             }">
                        </div>
                    </div>

                </div>
            </div>

            <!-- UNIFIED ACTION & NAVIGATION BAR -->
            <div x-data="{ showSuperiorPrompt: false }"
                class="bg-gray-900/90 border border-gray-800/80 rounded-lg p-3 shadow-sm relative min-h-[52px] flex items-center">

                <!-- STAGE 1: Default Classification View -->
                <div x-show="!showSuperiorPrompt" class="grid grid-cols-3 items-center w-full">

                    <!-- Left Column: Empty placeholder to keep center text centered -->
                    <div></div>

                    <!-- Center Column: Instruction Text -->
                    <div class="text-sm text-gray-200 font-medium text-center whitespace-nowrap">
                        <span>Classify image relationship</span>
                    </div>

                    <!-- Right Column: Action Buttons -->
                    <div class="flex items-center justify-end gap-2">
                        <button @click="showSuperiorPrompt = true"
                            class="text-xs px-3 py-1.5 rounded-md font-semibold transition bg-amber-950/60 hover:bg-amber-900/80 text-amber-300 border border-amber-800/80 active:scale-95 shadow-sm whitespace-nowrap">
                            Duplicate / Inferior
                        </button>

                        <button @click="setRelationship('variant', $data)"
                            class="text-xs px-3 py-1.5 rounded-md font-semibold transition bg-purple-950/60 hover:bg-purple-900/80 text-purple-300 border border-purple-800/80 active:scale-95 shadow-sm whitespace-nowrap">
                            Variants
                        </button>

                        <button @click="setRelationship('unrelated', $data)"
                            class="text-xs px-3 py-1.5 rounded-md font-semibold transition bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 active:scale-95 shadow-sm whitespace-nowrap">
                            Unrelated
                        </button>
                    </div>
                </div>

                <!-- STAGE 2: Superiority Selection View -->
                <div x-show="showSuperiorPrompt" x-cloak class="grid grid-cols-2 items-center w-full relative">

                    <!-- Center Text: Absolutely centered on top of everything -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <span class="text-sm text-amber-400 font-semibold">Select the superior post</span>
                    </div>

                    <!-- Left Half: Button centered under Left Image (25%) -->
                    <div class="flex justify-center">
                        <button
                            @click="setRelationship('duplicate', $data, currentPair.a.post_id); showSuperiorPrompt = false"
                            class="w-48 text-xs px-3 py-1.5 rounded-md font-semibold transition bg-amber-600 hover:bg-amber-500 text-white border border-amber-400 active:scale-95 shadow-md truncate">
                            <span x-text="`#${currentPair.a.post_id}`"></span>
                        </button>
                    </div>

                    <!-- Right Half: Button centered under Right Image (75%) -->
                    <div class="flex justify-center">
                        <button
                            @click="setRelationship('duplicate', $data, currentPair.b.post_id); showSuperiorPrompt = false"
                            class="w-48 text-xs px-3 py-1.5 rounded-md font-semibold transition bg-amber-600 hover:bg-amber-500 text-white border border-amber-400 active:scale-95 shadow-md truncate">
                            <span x-text="`#${currentPair.b.post_id}`"></span>
                        </button>
                    </div>

                    <!-- Absolute Cancel Button on Far Right (Does not steal width from grid!) -->
                    <button @click="showSuperiorPrompt = false" title="Cancel selection"
                        class="absolute right-0 text-xs px-2.5 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-800 transition">
                        ✕
                    </button>
                </div>

            </div>

        </div>
    </template>
</div>
