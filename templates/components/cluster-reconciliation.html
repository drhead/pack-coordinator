<div class="bg-gray-950/80 border border-gray-800/80 rounded-lg p-4 space-y-4 text-gray-200 text-xs">

    <!-- 1. TOP ROW: Multi-Type Graph Selection Tabs -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-2 border-b border-gray-800/80">
        <template x-for="(graph, idx) in reconcileGraphs" :key="idx">
            <button @click="selectGraph(idx)"
                class="text-xs px-3 py-1.5 rounded-md font-mono font-semibold transition border flex items-center gap-2 shadow-sm shrink-0 cursor-pointer"
                :class="getGraphTabClass(graph, idx)">

                <!-- Graph Label -->
                <span x-text="getGraphTabLabel(graph, idx)"></span>

                <!-- Dot indicator container -->
                <div class="flex items-center gap-1 ml-0.5">
                    <template x-for="post in (graph.posts || graph.nodes || graph)" :key="post.id || post">
                        <span class="w-2 h-2 rounded-full transition-colors"
                            :class="activeGraphIndex === idx ? 'bg-white' : 'bg-gray-400/70'"></span>
                    </template>
                </div>

            </button>
        </template>
    </div>

    <!-- 2. IMAGE PREVIEW GRID (Explicit 2-Column Layout) -->
    <template x-if="currentGraph">
        <div class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 relative">

                <!-- LHS Column: Kept Superior Post Only (aligned via JS padding-top) -->
                <div class="flex flex-col space-y-2" x-ref="lhsColumn">
                    <template x-if="selectedSuperiorId">
                        <!-- LHS Cohesive Card -->
                        <div class="border border-gray-800 rounded-lg overflow-hidden bg-gray-950 flex flex-col">

                            <!-- Header Bar -->
                            <div
                                class="bg-gray-900 px-2.5 py-1.5 flex items-center justify-between text-xs border-b border-gray-800">
                                <div class="flex items-center gap-2">
                                    <a :href="`https://e621.net/posts/${selectedSuperiorId}`" target="_blank"
                                        rel="noopener noreferrer"
                                        class="font-mono font-bold text-blue-400 hover:text-blue-300 hover:underline"
                                        x-text="`#${selectedSuperiorId}`"></a>
                                    
                                    <template x-if="currentGraph?.type === 'variant'">
                                        <span class="text-[9px] uppercase font-black bg-purple-800 px-1.5 py-0.5 rounded text-purple-200">PARENT / HEAD</span>
                                    </template>
                                    <template x-if="currentGraph?.type === 'unrelated'">
                                        <span class="text-[9px] uppercase font-black bg-gray-700 px-1.5 py-0.5 rounded text-gray-200">TARGET</span>
                                    </template>
                                    <template x-if="!currentGraph || currentGraph?.type === 'duplicate'">
                                        <span class="text-[9px] uppercase font-black bg-blue-800 px-1.5 py-0.5 rounded text-blue-200">SUPERIOR</span>
                                    </template>
                                </div>
                                <a :href="`https://e621.net/posts/${selectedSuperiorId}`" target="_blank"
                                    rel="noopener noreferrer"
                                    class="text-[11px] font-semibold text-gray-400 hover:text-gray-200 hover:underline flex items-center gap-0.5">
                                    <span>e621</span>
                                    <span class="text-[9px]">&nearr;</span>
                                </a>
                            </div>

                            <!-- Image Viewport (edge-to-edge) -->
                            <div data-image-viewport
                                class="relative w-full h-72 bg-gray-950 flex items-center justify-center overflow-hidden select-none cursor-pointer group"
                                @click="openModal(getLocalClusterPost(selectedSuperiorId))">
                                <div class="relative inline-flex items-center justify-center max-h-full max-w-full">
                                    <img :src="getLocalClusterPost(selectedSuperiorId)?.fileUrl"
                                        class="max-h-72 max-w-full object-contain">
                                    <load src="/templates/components/expand-image-button.html" />
                                </div>
                            </div>

                            <!-- Description & Sources (integrated below image) -->
                            <template x-if="getLocalClusterPost(selectedSuperiorId)">
                                <div>
                                    <template
                                        x-if="getLocalClusterPost(selectedSuperiorId)?.description && getLocalClusterPost(selectedSuperiorId)?.description.trim().length > 0">
                                        <details class="text-[11px] group border-t border-gray-800">
                                            <summary
                                                class="bg-gray-900 px-2.5 py-1 font-semibold text-gray-400 hover:text-gray-200 cursor-pointer select-none flex items-center justify-between">
                                                <span>Description</span>
                                                <span
                                                    class="text-[9px] text-gray-500 group-open:rotate-180 transition-transform">▼</span>
                                            </summary>
                                            <div class="px-2.5 py-2 border-t border-gray-800 text-gray-300 whitespace-pre-wrap wrap-break-word max-h-36 overflow-y-auto bg-gray-950"
                                                x-text="getLocalClusterPost(selectedSuperiorId).description"></div>
                                        </details>
                                    </template>

                                    <template
                                        x-if="getLocalClusterPost(selectedSuperiorId)?.sources && getLocalClusterPost(selectedSuperiorId)?.sources.length > 0">
                                        <details class="text-[11px] group border-t border-gray-800">
                                            <summary
                                                class="bg-gray-900 px-2.5 py-1 font-semibold text-gray-400 hover:text-gray-200 cursor-pointer select-none flex items-center justify-between">
                                                <span
                                                    x-text="`Sources (${getLocalClusterPost(selectedSuperiorId).sources.length})`"></span>
                                                <span
                                                    class="text-[9px] text-gray-500 group-open:rotate-180 transition-transform">▼</span>
                                            </summary>
                                            <div
                                                class="px-2.5 py-2 border-t border-gray-800 space-y-1 max-h-32 overflow-y-auto bg-gray-950">
                                                <template
                                                    x-for="(src, sIdx) in getLocalClusterPost(selectedSuperiorId).sources"
                                                    :key="sIdx">
                                                    <a :href="src" target="_blank" rel="noopener noreferrer"
                                                        class="block truncate text-blue-400 hover:text-blue-300 hover:underline font-mono text-[10px]"
                                                        x-text="src"></a>
                                                </template>
                                            </div>
                                        </details>
                                    </template>
                                </div>
                            </template>

                        </div>
                    </template>
                </div>

                <!-- RHS Column: Inferior Posts Stack -->
                <div class="space-y-4 flex flex-col" x-ref="rhsColumn" x-init="setupImageAlignment($el)">
                    <template x-for="pId in rhsPostIds" :key="pId">
                        <!-- RHS Cohesive Card (Collapsible Image) -->
                        <div class="border border-gray-800 rounded-lg overflow-hidden bg-gray-950 flex flex-col"
                            x-data="{ collapsed: false }">

                            <!-- Header Bar (click to collapse/expand image if not deleted) -->
                            <div class="bg-gray-900 px-2.5 py-1.5 flex items-center justify-between text-xs border-b border-gray-800 select-none"
                                :class="isPostDeleted(pId) ? 'cursor-default' : 'cursor-pointer'"
                                @click="if (!isPostDeleted(pId)) collapsed = !collapsed">
                                <div class="flex items-center gap-2">
                                    <template x-if="!isPostDeleted(pId)">
                                        <a :href="`https://e621.net/posts/${pId}`" target="_blank"
                                            rel="noopener noreferrer"
                                            class="font-mono font-bold text-blue-400 hover:text-blue-300 hover:underline"
                                            x-text="`#${pId}`" @click.stop></a>
                                    </template>
                                    <template x-if="isPostDeleted(pId)">
                                        <span class="font-mono font-bold text-gray-400" x-text="`#${pId}`"></span>
                                    </template>

                                    <!-- Badges -->
                                    <template x-if="isPostDeleted(pId)">
                                        <span
                                            class="text-[9px] uppercase font-black bg-red-950 text-red-400 border border-red-800/50 px-1.5 py-0.5 rounded">DELETED</span>
                                    </template>
                                    <template x-if="!isPostDeleted(pId) && isPostFlagged(pId)">
                                        <span
                                            class="text-[9px] uppercase font-black bg-amber-950 text-amber-400 border border-amber-800/50 px-1.5 py-0.5 rounded">FLAGGED</span>
                                    </template>
                                    <template x-if="!isPostDeleted(pId) && !isPostFlagged(pId)">
                                        <div>
                                            <template x-if="currentGraph?.type === 'variant'">
                                                <span class="text-[9px] uppercase font-black bg-purple-950 text-purple-300 border border-purple-800/50 px-1.5 py-0.5 rounded">VARIANT</span>
                                            </template>
                                            <template x-if="currentGraph?.type === 'unrelated'">
                                                <span class="text-[9px] uppercase font-black bg-gray-800 text-gray-400 border border-gray-700/50 px-1.5 py-0.5 rounded">REFERENCE</span>
                                            </template>
                                            <template x-if="!currentGraph || currentGraph?.type === 'duplicate'">
                                                <span class="text-[9px] uppercase font-black bg-gray-700 px-1.5 py-0.5 rounded text-gray-300">INFERIOR</span>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Collapse indicator chevron (only if not deleted) -->
                                    <template x-if="!isPostDeleted(pId)">
                                        <span class="text-[9px] text-gray-500 transition-transform"
                                            :class="collapsed ? '' : 'rotate-180'">▼</span>
                                    </template>
                                </div>

                                <!-- e621 external link (only if not deleted) -->
                                <template x-if="!isPostDeleted(pId)">
                                    <a :href="`https://e621.net/posts/${pId}`" target="_blank" rel="noopener noreferrer"
                                        class="text-[11px] font-semibold text-gray-400 hover:text-gray-200 hover:underline flex items-center gap-0.5"
                                        @click.stop>
                                        <span>e621</span>
                                        <span class="text-[9px]">&nearr;</span>
                                    </a>
                                </template>
                            </div>

                            <!-- Image Viewport (collapsible, edge-to-edge) -->
                            <div data-image-viewport>
                                <div x-show="!isPostDeleted(pId) && !collapsed"
                                    x-transition:enter="transition-all duration-200 ease-out"
                                    x-transition:enter-start="opacity-0 max-h-0"
                                    x-transition:enter-end="opacity-100 max-h-72"
                                    x-transition:leave="transition-all duration-150 ease-in"
                                    x-transition:leave-start="opacity-100 max-h-72"
                                    x-transition:leave-end="opacity-0 max-h-0"
                                    class="relative w-full h-72 bg-gray-950 flex items-center justify-center overflow-hidden select-none cursor-pointer group"
                                    @click="openModal(getLocalClusterPost(pId))">
                                    <div class="relative inline-flex items-center justify-center max-h-full max-w-full">
                                        <img :src="getLocalClusterPost(pId)?.fileUrl"
                                            class="max-h-72 max-w-full object-contain">
                                        <load src="/templates/components/expand-image-button.html" />
                                    </div>
                                </div>
                            </div>

                            <!-- Description & Sources (integrated below image) -->
                            <template x-if="getLocalClusterPost(pId)">
                                <div>
                                    <template
                                        x-if="getLocalClusterPost(pId)?.description && getLocalClusterPost(pId)?.description.trim().length > 0">
                                        <details class="text-[11px] group border-t border-gray-800">
                                            <summary
                                                class="bg-gray-900 px-2.5 py-1 font-semibold text-gray-400 hover:text-gray-200 cursor-pointer select-none flex items-center justify-between">
                                                <span>Description</span>
                                                <span
                                                    class="text-[9px] text-gray-500 group-open:rotate-180 transition-transform">▼</span>
                                            </summary>
                                            <div class="px-2.5 py-2 border-t border-gray-800 text-gray-300 whitespace-pre-wrap wrap-break-word max-h-36 overflow-y-auto bg-gray-950"
                                                x-text="getLocalClusterPost(pId).description"></div>
                                        </details>
                                    </template>

                                    <template
                                        x-if="getLocalClusterPost(pId)?.sources && getLocalClusterPost(pId)?.sources.length > 0">
                                        <details class="text-[11px] group border-t border-gray-800">
                                            <summary
                                                class="bg-gray-900 px-2.5 py-1 font-semibold text-gray-400 hover:text-gray-200 cursor-pointer select-none flex items-center justify-between">
                                                <span
                                                    x-text="`Sources (${getLocalClusterPost(pId).sources.length})`"></span>
                                                <span
                                                    class="text-[9px] text-gray-500 group-open:rotate-180 transition-transform">▼</span>
                                            </summary>
                                            <div
                                                class="px-2.5 py-2 border-t border-gray-800 space-y-1 max-h-32 overflow-y-auto bg-gray-950">
                                                <template x-for="(src, sIdx) in getLocalClusterPost(pId).sources"
                                                    :key="sIdx">
                                                    <a :href="src" target="_blank" rel="noopener noreferrer"
                                                        class="block truncate text-blue-400 hover:text-blue-300 hover:underline font-mono text-[10px]"
                                                        x-text="src"></a>
                                                </template>
                                            </div>
                                        </details>
                                    </template>
                                </div>
                            </template>

                        </div>
                    </template>
                </div>

            </div>

            <!-- UNIFIED ACTION & NAVIGATION BAR -->
            <div
                class="bg-gray-900/90 border border-gray-800/80 rounded-lg p-3 relative min-h-15 flex items-center justify-between shadow-sm">

                <!-- Instructions Center View -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none px-12">
                    <span class="text-sm font-semibold text-amber-300 text-center">
                        Transfer over any tags that apply to #<span x-text="selectedSuperiorId"></span> below, then
                        click the button to proceed.
                    </span>
                </div>

                <!-- Navigation Action Button -->
                <div class="ml-auto flex items-center justify-end shrink-0 z-10">
                    <button @click="advance($data)" :disabled="warnings && warnings.isBlocked(activeGraphIndex, $data)"
                        class="text-xs px-4 py-1.5 rounded-md font-bold transition shadow flex items-center gap-2"
                        :class="(warnings && warnings.isBlocked(activeGraphIndex, $data)) 
                                ? 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700/60' 
                                : 'bg-blue-600 hover:bg-blue-500 text-white cursor-pointer'">
                        <span x-text="nextButtonLabel"></span>
                        <span>→</span>
                    </button>
                </div>
            </div>

            <!-- Warnings Stack Container (Positioned below top nav bar) -->
            <div x-data="{ scopeId: activeGraphIndex }" class="w-full">
                <load src="/templates/components/warning-banner.html" />
            </div>
        </div>
    </template>

    <!-- 3. TAG CARDS (Retagging Interface) -->
    <template x-if="lhsPost">
        <div class="relative grid grid-cols-1 md:grid-cols-2 gap-4">

            <!-- Static Block Arrow Indicator -->
            <div
                class="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none items-center justify-center">
                <svg class="w-12 h-12 text-blue-500/90 fill-current drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <!-- Solid, balanced block arrow path -->
                    <path d="M20 10H11V6L4 12L11 18V14H20V10Z" />
                </svg>
            </div>

            <!-- LHS: Kept Post Tag Card -->
            <div
                class="bg-gray-950/80 border border-gray-800/80 rounded-lg p-3.5 text-xs space-y-3 flex flex-col justify-between shadow-sm h-full">
                <div class="space-y-3 flex-1 flex flex-col">
                    <!-- Post Header Line -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span
                                class="w-5 h-5 inline-flex items-center justify-center rounded text-[12px] font-bold font-mono transition-colors"
                                :class="$store.tags.getRatingBadgeClass(getEffectiveLhsRating())"
                                x-text="$store.tags.getRatingLabel(getEffectiveLhsRating())"></span>

                            <a :href="`https://e621.net/posts/${lhsPost.postId}`" target="_blank"
                                class="font-mono font-bold text-blue-400 hover:text-blue-300 hover:underline text-sm flex items-center space-x-1">
                                <span x-text="`#${lhsPost.postId}`"></span>
                                <span class="text-gray-600 text-xs">&nearr;</span>
                            </a>

                            <template x-if="lhsPost.parentId">
                                <a :href="`https://e621.net/posts/${lhsPost.parentId}`" target="_blank"
                                    class="bg-gray-900/80 hover:bg-gray-800 text-gray-400 hover:text-gray-200 border border-gray-800 text-xs px-1.5 py-0.5 rounded font-mono transition">
                                    Parent #<span x-text="lhsPost.parentId"></span>
                                </a>
                            </template>

                            <!-- Pools Badges -->
                            <template x-if="lhsPost.poolIds && lhsPost.poolIds.length > 0">
                                <div class="flex items-center space-x-1 font-mono">
                                    <template x-for="poolId in lhsPost.poolIds" :key="poolId">
                                        <a :href="`https://e621.net/pools/${poolId}`" target="_blank"
                                            class="bg-gray-900/80 hover:bg-gray-800 text-blue-400 hover:text-blue-300 border border-gray-800 text-xs px-1.5 py-0.5 rounded transition">
                                            Pool #<span x-text="poolId"></span>
                                        </a>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <!-- Right Details: Flag Status, Dimensions Info -->
                        <div class="flex items-center space-x-2">
                            <template x-if="lhsPost.isDeleted">
                                <span
                                    class="bg-red-950 text-red-400 border border-red-800/50 px-1.5 py-0.5 rounded text-[10px] font-bold">DELETED</span>
                            </template>
                            <template x-if="!lhsPost.isDeleted && lhsPost.isFlagged">
                                <span
                                    class="bg-amber-950 text-amber-400 border border-amber-800/50 px-1.5 py-0.5 rounded text-[10px] font-bold">FLAGGED</span>
                            </template>

                            <span class="font-mono text-[11px]"
                                x-html="image.formatSpecs(lhsPost, cluster.posts)">
                            </span>
                        </div>
                    </div>

                    <!-- Interactive LHS Tag Cloud & Controls (Unified Tag Pillbox Container) -->
                    <div
                        class="bg-gray-900/90 p-2.5 rounded-md border border-gray-800/80 space-y-2.5 flex-1 flex flex-col justify-between">
                        <div class="space-y-2.5 flex-1 flex flex-col">
                            <!-- Active Tag Pills Cloud -->
                            <div class="flex flex-wrap gap-x-1 gap-y-1 content-start">
                                <template x-for="tag in getSortedTags(lhsTags)" :key="tag.category + ':' + tag.name">
                                    <span
                                        class="font-mono text-[11px] leading-tight inline-flex items-center px-1 rounded border border-transparent select-none transition-all duration-150 ease-in-out"
                                        :class="tagpill.getTagClasses(tag, lhsPost, 'lhs', { hoveredImplicationData, newTags })"
                                        :style="tagpill.getTagStyle(tag, lhsPost, hoveredImplicationData)"
                                        :title="tagpill.getTagTitle(tag.name, lhsPost)"
                                        @click="if (!tagpill.isTagLocked(tag.name, lhsPost)) removeTagWithImplicators(tag)"
                                        @mouseenter="if (!tagpill.isTagLocked(tag.name, lhsPost)) hoveredImplicationData = getImplicationChain(lhsPost.postId, tag.name, lhsTags)"
                                        @mouseleave="hoveredImplicationData = null">

                                        <span x-text="tag.name"></span>

                                        <!-- Implied Tag Marker -->
                                        <span x-show="isImpliedTag(tag.name, lhsTags)"
                                            class="text-emerald-400 font-bold text-[9px] ml-0.5 select-none"
                                            title="Implied tag">i</span>

                                        <!-- Locked Tag Indicator vs. Remove Icon -->
                                        <template x-if="tagpill.isTagLocked(tag.name, lhsPost)">
                                            <svg class="w-2.5 h-2.5 ml-1 text-gray-400/80 inline" fill="currentColor"
                                                viewBox="0 0 20 20">
                                                <path fill-rule="evenodd"
                                                    d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                                                    clip-rule="evenodd" />
                                            </svg>
                                        </template>
                                    </span>
                                </template>
                            </div>

                            <!-- Removed Tags (Separated by horizontal border) -->
                            <template x-if="removedLhsTags.length > 0">
                                <div class="space-y-1 pt-1.5 border-t border-gray-800/60">
                                    <div class="flex flex-wrap gap-x-1 gap-y-1">
                                        <template x-for="tag in getSortedTags(removedLhsTags)"
                                            :key="tag.category + ':' + tag.name">
                                            <span @click="addTagWithImplications(tag.name)"
                                                class="font-mono text-[11px] leading-tight inline-flex items-center px-1.5 py-0.5 rounded bg-gray-950 text-gray-600 line-through border border-gray-800 cursor-pointer hover:text-gray-300 hover:no-underline"
                                                title="Click to restore">
                                                <span x-text="tag.name"></span>
                                            </span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Rating Selector & Custom Tag Input Controls (Moved inside tag pillbox, separated by horizontal line) -->
                        <div
                            class="pt-2.5 border-t border-gray-800/60 flex flex-wrap items-center justify-between gap-3 mt-auto">
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] font-semibold text-gray-400">Rating:</span>
                                <div class="flex bg-gray-950 border border-gray-800 rounded p-0.5 gap-1">
                                    <template x-for="r in ['s', 'q', 'e']" :key="r">
                                        <button @click="activeRating = r"
                                            class="text-xs w-5 h-5 rounded font-bold uppercase transition cursor-pointer"
                                            :class="activeRating === r 
                                                    ? ($store.tags.getRatingBadgeClass(r)) 
                                                    : 'text-gray-400 hover:text-white hover:bg-gray-800 border border-transparent'">
                                            <span x-text="r"></span>
                                        </button>
                                    </template>
                                </div>
                                <template x-if="hasRatingConflict">
                                    <span class="text-[10px] font-bold text-red-400 uppercase tracking-wide"
                                        title="Conflict Detected">⚠️ Rating Mismatch</span>
                                </template>
                            </div>

                            <div class="relative flex-1 min-w-50 max-w-xs" x-data="tagAutocomplete()"
                                @add-tag="addCustomTag()" @click.outside="isOpen = false">

                                <div class="flex items-center gap-1.5 w-full">
                                    <input type="text" x-model="tagInput" @input="onInput"
                                        @keydown.enter.prevent="selectCurrentOrAdd()"
                                        @keydown.arrow-down.prevent="navigate(1)"
                                        @keydown.arrow-up.prevent="navigate(-1)"
                                        @keydown.escape.prevent="isOpen = false" placeholder="Add tag..."
                                        class="flex-1 text-xs bg-gray-950 border border-gray-800 rounded px-2 py-1 text-gray-200 focus:outline-none focus:border-blue-500 min-w-0">

                                    <button type="button" @click="commitTag()"
                                        class="cursor-pointer text-xs px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded font-semibold transition shrink-0">
                                        Add
                                    </button>
                                </div>

                                <div x-show="isOpen && results.length > 0" x-transition
                                    class="absolute bottom-full mb-1 left-0 right-0 min-w-85 z-50 bg-gray-950 border border-gray-800 rounded shadow-2xl max-h-72 overflow-y-auto divide-y divide-gray-900"
                                    style="display: none;">

                                    <template x-for="(item, index) in results"
                                        :key="item.aliasedFrom ? item.aliasedFrom + '->' + item.name : item.name">
                                        <div @click="selectResult(item)" @mouseenter="selectedIndex = index"
                                            :class="{ 'bg-gray-800': selectedIndex === index }"
                                            class="flex items-center justify-between px-2.5 py-1.5 text-xs cursor-pointer hover:bg-gray-800 transition-colors gap-3">

                                            <div class="truncate flex items-center gap-1 min-w-0"
                                                :title="item.aliasedFrom ? `${item.aliasedFrom} → ${item.name}` : item.name">

                                                <template x-if="item.aliasedFrom">
                                                    <span class="flex items-center gap-1 truncate shrink-0 max-w-[45%]">
                                                        <span :style="$store.tags.getTagStyle('INVALID')"
                                                            class="truncate" x-text="item.aliasedFrom"></span>
                                                        <span class="text-gray-500 select-none">→</span>
                                                    </span>
                                                </template>

                                                <span :style="$store.tags.getTagStyle(item.category)"
                                                    class="truncate min-w-0" x-text="item.name"></span>
                                            </div>

                                            <span class="text-gray-400 font-mono text-[11px] shrink-0 pl-1"
                                                :title="`${item.count.toLocaleString()} posts`">
                                                (<span x-text="formatCount(item.count)"></span>)
                                            </span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RHS: Set Union Tag Cloud for All Inferior Posts in Graph -->
            <div
                class="bg-gray-950/80 border border-gray-800/80 rounded-lg p-3.5 text-xs space-y-3 shadow-sm flex flex-col h-full justify-between">
                <div class="space-y-3 flex-1 flex flex-col">
                    <!-- Post Header Line (Single post vs Combined multi-post) -->
                    <template x-if="rhsPosts.length === 1">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <template x-if="rhsPosts[0].rating">
                                    <span
                                        class="w-5 h-5 inline-flex items-center justify-center rounded text-[12px] font-bold font-mono transition-colors"
                                        :class="$store.tags.getRatingBadgeClass(rhsPosts[0].rating)"
                                        x-text="$store.tags.getRatingLabel(rhsPosts[0].rating)"></span>
                                </template>

                                <a :href="`https://e621.net/posts/${rhsPosts[0].postId}`" target="_blank"
                                    class="font-mono font-bold text-blue-400 hover:text-blue-300 hover:underline text-sm flex items-center space-x-1">
                                    <span x-text="`#${rhsPosts[0].postId}`"></span>
                                    <span class="text-gray-600 text-xs">&nearr;</span>
                                </a>

                                <template x-if="rhsPosts[0].parentId">
                                    <a :href="`https://e621.net/posts/${rhsPosts[0].parentId}`" target="_blank"
                                        class="bg-gray-900/80 hover:bg-gray-800 text-gray-400 hover:text-gray-200 border border-gray-800 text-xs px-1.5 py-0.5 rounded font-mono transition">
                                        Parent #<span x-text="rhsPosts[0].parentId"></span>
                                    </a>
                                </template>

                                <!-- Pools Badges -->
                                <template x-if="rhsPosts[0].poolIds && rhsPosts[0].poolIds.length > 0">
                                    <div class="flex items-center space-x-1 font-mono">
                                        <template x-for="poolId in rhsPosts[0].poolIds" :key="poolId">
                                            <a :href="`https://e621.net/pools/${poolId}`" target="_blank"
                                                class="bg-gray-900/80 hover:bg-gray-800 text-blue-400 hover:text-blue-300 border border-gray-800 text-xs px-1.5 py-0.5 rounded transition">
                                                Pool #<span x-text="poolId"></span>
                                            </a>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <!-- Right Details: Flag Status, Dimensions Info -->
                            <div class="flex items-center space-x-2">
                                <template x-if="rhsPosts[0].isDeleted">
                                    <span
                                        class="bg-red-950 text-red-400 border border-red-800/50 px-1.5 py-0.5 rounded text-[10px] font-bold">DELETED</span>
                                </template>
                                <template x-if="!rhsPosts[0].isDeleted && rhsPosts[0].isFlagged">
                                    <span
                                        class="bg-amber-950 text-amber-400 border border-amber-800/50 px-1.5 py-0.5 rounded text-[10px] font-bold">FLAGGED</span>
                                </template>

                                <span class="font-mono text-[11px]"
                                    x-html="image.formatSpecs(rhsPosts[0], cluster.posts)">
                                </span>
                            </div>
                        </div>
                    </template>

                    <template x-if="rhsPosts.length > 1">
                        <div class="flex items-center justify-between">
                            <div class="flex flex-wrap items-center gap-3">
                                <template x-for="post in rhsPosts" :key="post.postId">
                                    <div class="flex items-center space-x-1.5">
                                        <template x-if="post.rating">
                                            <span
                                                class="w-5 h-5 inline-flex items-center justify-center rounded text-[12px] font-bold font-mono transition-colors"
                                                :class="$store.tags.getRatingBadgeClass(post.rating)"
                                                x-text="$store.tags.getRatingLabel(post.rating)"></span>
                                        </template>
                                        <a :href="`https://e621.net/posts/${post.postId}`" target="_blank"
                                            class="font-mono font-bold text-blue-400 hover:text-blue-300 hover:underline text-sm flex items-center space-x-0.5">
                                            <span x-text="`#${post.postId}`"></span>
                                            <span class="text-gray-600 text-xs">&nearr;</span>
                                        </a>
                                    </div>
                                </template>
                            </div>

                            <div class="text-[11px] font-mono text-gray-400 font-semibold">
                                <span
                                    x-text="`${allRhsUnionTagNames.length} tags from ${rhsPosts.length} posts`"></span>
                            </div>
                        </div>
                    </template>

                    <!-- Union Tag Cloud -->
                    <div
                        class="bg-gray-900/90 p-2.5 rounded-md border border-gray-800/80 space-y-1.5 flex-1 flex flex-col">
                        <div class="flex flex-wrap gap-x-1 gap-y-1 content-start">
                            <template x-for="tag in getSortedTags(allRhsUnionTagNames)"
                                :key="tag.category + ':' + tag.name">
                                <span
                                    class="font-mono text-[11px] leading-tight inline-flex items-center px-1 rounded border border-transparent select-none transition-all duration-150 ease-in-out"
                                    :class="tagpill.getTagClasses(tag, getRhsSourcePost(tag.name), 'rhs', { hoveredImplicationData, isLhs: isTagOnLhs(tag.name) })"
                                    :style="tagpill.getTagStyle(tag, getRhsSourcePost(tag.name), hoveredImplicationData)"
                                    :title="tagpill.getTagTitle(tag.name)"
                                    @click="if (!isTagOnLhs(tag.name)) addTagWithImplications(tag.name)"
                                    @mouseenter="hoveredImplicationData = getImplicationChain(getRhsSourcePost(tag.name)?.postId, tag.name, getRhsSourcePost(tag.name))"
                                    @mouseleave="hoveredImplicationData = null">
                                    <span x-text="tag.name"></span>
                                    <span x-show="isImpliedTag(tag.name, getRhsSourcePost(tag.name))"
                                        class="text-emerald-400 font-bold text-[9px] ml-0.5 select-none"
                                        title="Implied tag">i</span>
                                </span>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
